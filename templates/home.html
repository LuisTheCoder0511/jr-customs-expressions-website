<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Customs Expressions</title>
</head>
<body>
    <div id="header">
        <a id="logo" href="/">
            <img src="/static/assets/images/home_logo.png" alt="logo"/>
        </a>
        <div id="buttons">
            <a>
                <img src="/static/assets/images/button_products.png" alt="Items">
            </a>
            <a>
                <img src="/static/assets/images/button_reviews.png" alt="Items">
            </a>
            <a>
                <img src="/static/assets/images/button_about.png" alt="Items">
            </a>
        </div>
        <a id="account">
            <img src="/static/assets/images/account.webp" alt="account"/>
        </a>
        <div id="popup"></div>
    </div>
    <div id="welcome">
        <img id=home_logo src="/static/assets/images/jr_home_logo.png" alt="logo"/>
    </div>
    <div id="products">
        <div id="products_header">
            <div id="products_header_title">
                Products
            </div>
            <div id="products_header_input">
                <div id="products_header_search">
                    <label for="products_header_search_input"></label><input id="products_header_search_input"/>
                    <a id="products_header_search_button">
                       <img id="products_header_search_image" src="/static/assets/images/search.png" alt="search"/>
                    </a>
                </div>
                <div id="products_header_filter">
                    <a id="products_header_filter_new">
                        New!
                    </a>
                    <a id="products_header_filter_featured">
                        Featured
                    </a>
                    <a id="products_header_popular">
                        Popular
                    </a>
                </div>
            </div>
        </div>
        <div id="products_content">
            <div id="products_content_title">
                Results of "Something"
            </div>
        </div>
    </div>
    <div id="reviews">

    </div>
    <div id="about">

    </div>
    <div id="footer">

    </div>
</body>
<script src="/static/js/home.js"></script>
<link rel="stylesheet" href="/static/css/home.css"/>
</html>
