<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Customs Expressions - Login</title>
    <link rel="stylesheet" href="/static/css/customer/login/style.css"/>
</head>
<body>
    <div class="login">
        <div class="login_rectangle">
            <div class="logo">
                <img src="/static/assets/images/jr_home_logo.png" alt="Home Logo"/>
            </div>
            <div id="login_welcome_text">
                Login
            </div>
            <form id="login_form" action="/login/submit" method="post">
                <div class="login_label">
                    <label>
                        <input id="login_username" name="username" type="text" placeholder="Username">
                    </label>
                </div>
                <div class="login_label">
                    <label>
                        <input id="login_password" name="password" type="password" placeholder="Password">
                    </label>
                </div>
                <div class="remember_me">
                    <a class="remember_me_box" onclick="remember_me()">
                        <img id="checkmark" src="/static/assets/images/checkmark.png" alt="check" style="visibility: hidden"/>
                        <input type="hidden" name="remember" id="checkmarkVisibility" value="hidden">
                    </a>
                    <div class="remember_me_label">
                        Remember me?
                    </div>
                </div>
                <input type="hidden" id="register" name="register" value="false">
            </form>
            <div id="forgot">
                <a>
                    Forgot password?
                </a>
            </div>
            <a id="login_button" href="#" onclick="document.getElementById('login_form').submit()">
                Login
            </a>
            <div class="third-party-logins">
                <div id="third_party_logins_label">
                    Sign in with
                </div>
                <div class="third-party-logins-icons">
                    <a class="facebook">
                        <img src="/static/assets/images/facebook.png" alt="facebook"/>
                    </a>
                    <a class="instagram">
                        <img src="/static/assets/images/instagram.webp" alt="instagram"/>
                    </a>
                    <a class="linkedin">
                        <img src="/static/assets/images/linkedin.webp" alt="linkedin"/>
                    </a>
                </div>
            </div>
            <div id="other_login">
                <div id="other_login_text">
                    Don't have an account?
                </div>
                <a id="other_login_link" onclick="register_switch()">
                    Sign up!
                </a>
            </div>
        </div>
    </div>
</body>
<script src="/static/js/customer/login/script.js"></script>
</html>
