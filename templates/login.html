<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR Customs Expressions - Login</title>
</head>
<body>
    <div id="login_page">
        <div id="login_container">
            <div id="login_logo">
                <img src="/static/assets/images/jr_second_logo.png" alt="logo"/>
            </div>
            <div class="login_input">
                <div id="login_username">
                    Username
                </div>
                <label for="username"></label><input id="username">
            </div>
            <div class="login_input">
                <div id="login_password">
                    Password
                </div>
                <label for="password"></label><input id="password" type="password">
            </div>
            <div id="login_input_password2" class="login_input">
                <div id="login_password2">
                    Re-enter Password
                </div>
                <label for="password2"></label><input id="password2" type="password">
            </div>
            <div id="submit">
                <a id="submit_text">
                    Login
                </a>
            </div>
            <div id="click">
                <div id="click_div">
                    Don't have an account?
                </div>
                <a id="click_a">
                    Register here!
                </a>
            </div>
        </div>
    </div>
</body>

<script src="/static/js/base.js"></script>
<script src="/static/js/login.js"></script>

<link rel="stylesheet" href="/static/css/base/base.css"/>
<link rel="stylesheet" href="/static/css/login.css"/>

</html>
